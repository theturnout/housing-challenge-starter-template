# CodeQL scans your source for security vulnerabilities.
#
# EASIEST PATH: you may not need this file at all. GitHub's "default setup"
# turns on CodeQL from the repository UI with no workflow to maintain:
#   Settings -> Code security -> Code scanning -> CodeQL analysis -> Set up -> Default
# See docs/REPO_SETUP_GUIDE.md. If you use default setup, delete this file.
#
# Use this "advanced" workflow only if you need to customize the scan. Set the
# `language` matrix to your language(s).
#
# CodeQL supports: c-cpp, csharp, go, java-kotlin, javascript-typescript,
# python, ruby, swift (and others in preview). If your language is NOT
# supported (e.g., R, Julia), you cannot use CodeQL — rely instead on secret
# scanning, Dependabot alerts, and dependency review, and note this in
# docs/DISCLOSURES.md.

name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Replace with your language(s), e.g. python, javascript-typescript, go.
        language: ["python"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
